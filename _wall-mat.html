<!doctype html><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const L=new THREE.GLTFLoader();
const paths=[
'assets/models/unity/modular-victorian-interior-mansion/Victorian%20Asset%20Pack/Resources/Models/Wall_01_NoLedge.glb',
'assets/models/unity/modular-victorian-interior-mansion/Victorian%20Asset%20Pack/Resources/Models/WoodenWallPanel.glb',
'assets/models/unity/modular-victorian-interior-mansion/Victorian%20Asset%20Pack/Resources/Models/Wall_01.glb',
];
(async()=>{
 for(const p of paths){
  try{
   const g=await new Promise((ok,bad)=>L.load(p,ok,undefined,bad));
   const mats=[];
   g.scene.traverse(o=>{ if(!o.isMesh) return; const ms=[].concat(o.material||[]); ms.forEach(m=>mats.push({mesh:o.name, mat:m&&m.name, map:!!(m&&m.map), color:m&&m.color&&'#'+m.color.getHexString(), type:m&&m.type})); });
   const b=new THREE.Box3().setFromObject(g.scene); const s=b.getSize(new THREE.Vector3());
   console.log(JSON.stringify({p:decodeURIComponent(p).split('/').pop(), size:[+s.x.toFixed(2),+s.y.toFixed(2),+s.z.toFixed(2)], mats:mats.slice(0,8)}));
  }catch(e){ console.log(JSON.stringify({p, err:String(e)})); }
 }
 window.DONE=1;
})();
</script>
