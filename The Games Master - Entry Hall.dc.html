<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="./gm-doubt.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Spectral:ital,wght@0,400;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  ::selection { background: rgba(242,199,89,0.28); color: #FFFFF2; }
  #hall-scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 0; cursor: grab; }
  #hall-scene:active { cursor: grabbing; }
  @keyframes rise { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
</style>
</helmet>

<div style="position:relative;width:100vw;height:100vh;background:#000;color:#EBE0D1;font-family:'Spectral',serif;overflow:hidden;">

  <canvas id="hall-scene"></canvas>

  <!-- letterbox -->
  <div style="position:fixed;top:0;left:0;right:0;height:8vh;background:#000;z-index:40;pointer-events:none;"></div>
  <div style="position:fixed;bottom:0;left:0;right:0;height:8vh;background:#000;z-index:40;pointer-events:none;"></div>
  <div style="position:fixed;inset:0;z-index:20;pointer-events:none;box-shadow:inset 0 0 320px 90px rgba(0,0,0,0.82);"></div>

  <!-- controls hint -->
  <div style="position:fixed;top:10.5vh;left:0;right:0;z-index:30;text-align:center;pointer-events:none;transition:opacity 1s ease;{{ hintStyle }}">
    <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.2em;color:#A69980;text-transform:uppercase;background:rgba(0,0,0,0.4);padding:6px 14px;">Click to capture mouse &nbsp;·&nbsp; W A S D · walk &nbsp;·&nbsp; shift · run &nbsp;·&nbsp; E · examine</span>
  </div>

  <!-- reveal beat -->
  <div style="position:fixed;bottom:12vh;left:0;right:0;z-index:30;text-align:center;padding:0 8vw;pointer-events:none;transition:opacity 1.1s ease;{{ beatStyle }}">
    <div style="font-family:'Cormorant Garamond',serif;font-size:clamp(22px,3.3vw,38px);line-height:1.12;color:#FFFFF2;text-shadow:0 3px 24px rgba(0,0,0,0.95);max-width:840px;margin:0 auto;">{{ beatMain }}</div>
    <div style="font-family:'Spectral',serif;font-style:italic;font-size:clamp(14px,1.7vw,19px);line-height:1.55;color:#E6B86B;text-shadow:0 2px 16px rgba(0,0,0,0.95);max-width:680px;margin:12px auto 0;">{{ beatSub }}</div>
  </div>

  <!-- interaction prompt -->
  <div style="position:fixed;bottom:9vh;left:0;right:0;z-index:31;text-align:center;pointer-events:none;transition:opacity .4s ease;{{ promptStyle }}">
    <span style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.16em;color:#FFFFF2;text-transform:uppercase;background:rgba(10,7,4,0.72);border:1px solid rgba(242,199,89,0.55);padding:9px 18px;">{{ promptText }}</span>
  </div>

  <!-- the parlor-doors arrival card -->
  <!-- (arrival is now a continuous walk-through through the doors, handled in the render loop) -->

  <!-- ===== DEV MENU (backtick) ===== -->
  <sc-if value="{{ devOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;top:12px;left:12px;z-index:90;width:252px;background:rgba(8,8,10,0.94);border:1px solid rgba(242,199,89,0.4);color:#EBE0D1;padding:12px 13px;box-shadow:0 14px 44px rgba(0,0,0,0.7);">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(242,199,89,0.2);padding-bottom:7px;margin-bottom:9px;">
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.22em;color:#F2C759;">DEV · ENTRY HALL</span>
        <span onClick="{{ onDevClose }}" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#A69980;cursor:pointer;">✕</span>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:0.14em;color:#8a7a5e;margin-bottom:6px;">JUMP TO</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;">
        <sc-for list="{{ devPhases }}" as="p" hint-placeholder-count="6">
          <span onClick="{{ p.on }}" style="{{ p.style }}">{{ p.label }}</span>
        </sc-for>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:0.14em;color:#8a7a5e;margin-bottom:6px;">STATE</div>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.5;">
        <sc-for list="{{ devRows }}" as="r" hint-placeholder-count="6">
          <span style="color:#8a7a5e;">{{ r.k }}</span><span style="color:#EBE0D1;text-align:right;">{{ r.v }}</span>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <div onClick="{{ onDevToggle }}" style="position:fixed;bottom:8px;left:10px;z-index:88;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:0.18em;color:#5c5344;cursor:pointer;">` DEV</div>

  <!-- warm gold flood as you pass through the doors -->
  <div style="{{ goldStyle }}"></div>
  <!-- headache vignette while waking -->
  <div style="{{ vignetteStyle }}"></div>
  <!-- fade -->
  <div style="{{ fadeStyle }}"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:720}}">
class Component extends DCLogic {
  state = { fade:1, beatOn:false, beatMain:'', beatSub:'', hintOn:false, promptOn:false, promptText:'', isArrival:false, gold:0, devOpen:false, headachePulse:0 };

  // z decreases as you walk deeper into the hall (start ~14, parlor doors at back ~ -30)
  beats = [
    { z:11,  main:'On my feet, the hall swam into focus.', sub:'Warmer than any place like this had a right to be. A fire I couldn\u2019t see threw gold across a floor of black-and-white marble. Somewhere above, cut glass caught the light and gave it back in pieces.' },
    { z:2,   main:'The house was dressed for someone.', sub:'Fresh flowers going brown at the edges. Two coats already on the stand, though the drive was empty. A decanter, poured. Set for a guest who was always, somehow, me.' },
    { z:-9,  main:'The portraits had all been painted mid-turn.', sub:'Every face on the staircase caught looking back over its shoulder \u2014 as if the painter had said my name, and they\u2019d all turned at once. None of them were smiling. One of them had no face at all yet.' },
    { z:-19, main:'The stairs went up into nothing.', sub:'Up past the landing the light simply stopped, like the house hadn\u2019t bothered to finish the parts no guest would reach. Down here, though, every candle was lit. He wanted me to see exactly this much.' },
    { z:-27, main:'And then, the doors at the end.', sub:'Taller than the rest. Warm at the seams. The only sound in the whole house came from behind them \u2014 the soft, patient shuffle of a deck being made ready.' }
  ];
  arrivalZ = -30;

  componentDidMount() {
    this.mode='hall'; this.walkEnabled=false; this._beat=-1;
    this.keys = {}; this.yaw = 0; this.pitch = 0; this.dragging = false;
    this.standY = 1.7;
    this._onKey = (e,d)=>{ const k=e.key.toLowerCase(); this.keys[k]=d; if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault(); if(k==='e'){ if(d&&!this._eDown){ this._eDown=true; this.tryExamine(); } if(!d) this._eDown=false; } };
    this._kd = (e)=>{ if(e.key==='`'||e.code==='Backquote'){ e.preventDefault(); this.toggleDev(); return; } this._onKey(e,true); }; this._ku = (e)=>this._onKey(e,false);
    window.addEventListener('keydown', this._kd); window.addEventListener('keyup', this._ku);
    this._resize = ()=>this.onResize();
    window.addEventListener('resize', this._resize);
    this._errs = []; this._onErr = (e)=>{ this._errs.push(String((e&&e.message)||e)); }; window.addEventListener('error', this._onErr);
    window.__GMC = this;
    window.__GM = { scene:'hall', phases:this.devPhaseList(), goTo:(n)=>this.devGoTo(n), getState:()=>this.devSnapshot(), errors:()=>this._errs||[] };
    this.waitThree();
    // begin: wake on the floor of the hall — continuous from the Prologue knockout
    this._t0 = setTimeout(()=>this.beginWake(), 500);
  }
  componentWillUnmount() {
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._chandRaf) cancelAnimationFrame(this._chandRaf);
    window.removeEventListener('keydown', this._kd); window.removeEventListener('keyup', this._ku);
    window.removeEventListener('resize', this._resize);
    if (this._t0) clearTimeout(this._t0);
    (this._wt||[]).forEach(clearTimeout);
    if (this._sayTimer) clearTimeout(this._sayTimer);
    if (this._devTick) clearInterval(this._devTick);
    if (this._pulseTick) clearInterval(this._pulseTick);
    window.removeEventListener('error', this._onErr);
  }

  waitThree() { if (window.THREE) { try { this.initScene(); } catch(e){ console.warn('hall init', e); } } else { setTimeout(()=>this.waitThree(), 70); } }

  // groggy wake-up: come to on the marble, blink, then push up onto your feet
  beginWake() {
    (this._wt||[]).forEach(clearTimeout); this._wt = [];
    if (this._pulseTick) clearInterval(this._pulseTick);
    this.waking = true; this.rising = false; this.walkEnabled = false; this.mode='hall';
    this.standY = 0.34; this.wakeRoll = 1.15; this.wakePitch = 0.52; this.yaw = -0.22; this.pitch = 0;
    if (this.cam) this.cam.position.set(1.4, 0.34, 15);
    this.setState({ fade:1, isArrival:false, hintOn:false, promptOn:false, beatOn:true,
      beatMain:'A door boomed shut behind me.', beatSub:'Then a bolt, thrown home \u2014 and after that, nothing worth keeping.' });
    const T=(ms,fn)=>this._wt.push(setTimeout(fn,ms));
    T(2500, ()=> this.setState({ fade:0.6, beatMain:'Cold. The marble had my cheek.', beatSub:'My skull kept a slow, enormous pulse. Somewhere far off, a fire cracked and settled.' }));
    T(4700, ()=> this.setState({ fade:0.82 }));
    T(5500, ()=> this.setState({ fade:0.2, beatMain:'How long had I been under?', beatSub:'Long enough to be arranged. Set down facing the room \u2014 the way you pose a thing you mean to use.' }));
    T(7800, ()=> { this.setState({ fade:0 }); this.rising = true; this._riseStart = Date.now(); });
    T(11400,()=> {
      this.waking=false; this.rising=false; this.standY=1.7; this.wakeRoll=0; this.wakePitch=0;
      this.setState({ beatMain:'The chandelier hung dead still overhead.', beatSub:'Then — not a draft, nothing in this house moved on its own — it swayed, once, the way a thing does when someone has just let go of it.' });
      this.swayChandelier();
    });
    T(15000,()=> { this.walkEnabled=true; this.setState({ beatOn:false, hintOn:true, headachePulse:0 }); if (this._pulseTick) { clearInterval(this._pulseTick); this._pulseTick=null; } });
    this._pulseTick = setInterval(()=>{
      const decay = this.rising ? Math.max(0, 1 - (Date.now()-(this._riseStart||Date.now()))/3600) : 1;
      const t = Date.now()/1000;
      this.setState({ headachePulse: decay * (0.5+0.5*Math.sin(t*2*Math.PI/1.1)) });
    }, 80);
  }

  // scripted sway after waking — takes over from the render loop's ambient
  // chandelier idle-sway (see `this.chand.rotation.z = Math.sin(t*0.5)*0.014`
  // in loop()) for the duration so the two writers don't fight over the same
  // property; `_chandRaf` is stored and cancelled in componentWillUnmount the
  // same way `_raf` is, in case a hot-swap tears this logic down mid-sway.
  swayChandelier() {
    if (!this.chand) return;
    this._chandSway = true;
    const start = Date.now(), dur = 2600;
    const tick = () => {
      const t = (Date.now()-start)/dur;
      if (t >= 1) { this.chand.rotation.z = 0; this._chandSway = false; this._chandRaf = null; return; }
      this.chand.rotation.z = Math.sin(t*Math.PI*3) * 0.05 * (1-t);
      this._chandRaf = requestAnimationFrame(tick);
    };
    tick();
  }

  makeTextures(THREE, renderer){
    const aniso = (renderer.capabilities.getMaxAnisotropy && renderer.capabilities.getMaxAnisotropy()) || 1;
    const cv=(w,h)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; };
    const tex=(c)=>{ const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=aniso; return t; };
    const rnd=(a,b)=>a+Math.random()*(b-a);

    // ---- marble tile painter (veined) ----
    const marbleTile=(g,ox,oy,s,base,vein)=>{
      g.fillStyle=base; g.fillRect(ox,oy,s,s);
      const grd=g.createLinearGradient(ox,oy,ox+s,oy+s);
      grd.addColorStop(0,'rgba(255,255,255,0.06)'); grd.addColorStop(0.5,'rgba(0,0,0,0.05)'); grd.addColorStop(1,'rgba(255,255,255,0.04)');
      g.fillStyle=grd; g.fillRect(ox,oy,s,s);
      g.save(); g.beginPath(); g.rect(ox,oy,s,s); g.clip();
      for(let v=0;v<8;v++){ g.strokeStyle=vein; g.globalAlpha=rnd(0.05,0.22); g.lineWidth=rnd(0.5,2.4); g.beginPath(); let px=ox+rnd(0,s), py=oy+rnd(0,s); g.moveTo(px,py); for(let k=0;k<6;k++){ px+=rnd(-s*0.4,s*0.4); py+=rnd(-s*0.4,s*0.4); g.lineTo(px,py);} g.stroke(); }
      g.globalAlpha=1; g.restore();
    };
    const fc=cv(512,512), fg=fc.getContext('2d');
    marbleTile(fg,0,0,256,'#2b2723','#6f6658'); marbleTile(fg,256,256,256,'#2b2723','#6f6658');
    marbleTile(fg,256,0,256,'#100d0a','#3a342a'); marbleTile(fg,0,256,256,'#100d0a','#3a342a');

    // ---- wood grain ----
    const woodC=(base,streak)=>{ const c=cv(256,512), g=c.getContext('2d'); g.fillStyle=base; g.fillRect(0,0,256,512);
      for(let i=0;i<90;i++){ g.strokeStyle=streak; g.globalAlpha=rnd(0.03,0.16); g.lineWidth=rnd(0.5,2.6); g.beginPath(); const x=rnd(-20,276); let xx=x; g.moveTo(x,0); for(let y=0;y<512;y+=14){ xx+=rnd(-3,3); g.lineTo(xx,y);} g.stroke(); }
      for(let k=0;k<3;k++){ const kx=rnd(24,232), ky=rnd(50,462); for(let r=9;r>0;r--){ g.strokeStyle=streak; g.globalAlpha=0.09; g.beginPath(); g.ellipse(kx,ky,r*1.7,r,0,0,7); g.stroke(); } }
      g.globalAlpha=1; return c; };

    // ---- damask wallpaper ----
    const wallC=cv(256,256), wg=wallC.getContext('2d'); wg.fillStyle='#241812'; wg.fillRect(0,0,256,256);
    for(let x=0;x<256;x+=24){ wg.fillStyle='rgba(255,240,210,0.03)'; wg.fillRect(x,0,12,256); }
    wg.strokeStyle='#4a361e'; wg.globalAlpha=0.35;
    for(let gx=0;gx<=256;gx+=64){ for(let gy=0;gy<=256;gy+=64){ wg.beginPath(); wg.ellipse(gx,gy,18,26,0,0,7); wg.stroke(); wg.beginPath(); wg.ellipse(gx+32,gy+32,18,26,0,0,7); wg.stroke(); wg.fillStyle='rgba(122,96,44,0.25)'; wg.beginPath(); wg.arc(gx,gy,3,0,7); wg.fill(); } }
    wg.globalAlpha=1;

    // ---- carpet weave (crimson, bordered) ----
    const carpC=cv(128,512), cg=carpC.getContext('2d'); cg.fillStyle='#5a1a1a'; cg.fillRect(0,0,128,512);
    for(let i=0;i<4000;i++){ cg.fillStyle=Math.random()<0.5?'rgba(0,0,0,0.08)':'rgba(180,120,90,0.06)'; cg.fillRect(rnd(0,128),rnd(0,512),2,2); }
    cg.strokeStyle='#8a6a2e'; cg.lineWidth=6; cg.strokeRect(10,10,108,492);
    cg.strokeStyle='#3a1010'; cg.lineWidth=2; cg.strokeRect(20,20,88,472);
    for(let y=40;y<512;y+=80){ cg.strokeStyle='rgba(138,106,46,0.5)'; cg.beginPath(); cg.moveTo(40,y); cg.lineTo(64,y+22); cg.lineTo(88,y); cg.lineTo(64,y-22); cg.closePath(); cg.stroke(); }

    // ---- plaster ceiling ----
    const plC=cv(256,256), pg=plC.getContext('2d'); pg.fillStyle='#171009'; pg.fillRect(0,0,256,256);
    for(let i=0;i<1400;i++){ pg.fillStyle=Math.random()<0.5?'rgba(0,0,0,0.06)':'rgba(120,90,50,0.04)'; pg.fillRect(rnd(0,256),rnd(0,256),rnd(1,4),rnd(1,4)); }

    // ---- painted portrait ----
    const portrait=(empty)=>{ const c=cv(256,340), g=c.getContext('2d');
      const bg=g.createRadialGradient(120,120,15,128,180,230); bg.addColorStop(0,'#3c3126'); bg.addColorStop(1,'#0c0906'); g.fillStyle=bg; g.fillRect(0,0,256,340);
      if(!empty){
        g.fillStyle='#1e222a'; g.beginPath(); g.moveTo(30,340); g.quadraticCurveTo(128,206,226,340); g.fill();           // shoulders / coat
        g.fillStyle='#6a5240'; g.fillRect(114,176,30,42);                                                                 // neck
        g.fillStyle='#7c6249'; g.beginPath(); g.ellipse(134,150,42,52,0.08,0,7); g.fill();                                // face, turned
        g.fillStyle='rgba(0,0,0,0.32)'; g.beginPath(); g.ellipse(152,150,24,52,0.08,0,7); g.fill();                       // shadow side
        g.fillStyle='#251a11'; g.beginPath(); g.ellipse(128,120,47,34,0,0,7); g.fill();                                   // hair
        g.fillStyle='#0c0a08'; g.beginPath(); g.ellipse(118,150,5,3,0,0,7); g.fill(); g.beginPath(); g.ellipse(142,151,5,3,0,0,7); g.fill(); // eyes, back over shoulder
        g.strokeStyle='rgba(0,0,0,0.3)'; g.lineWidth=1; g.beginPath(); g.moveTo(120,168); g.quadraticCurveTo(132,174,144,168); g.stroke();
      }
      g.strokeStyle='rgba(0,0,0,0.22)'; for(let i=0;i<50;i++){ g.globalAlpha=rnd(0.02,0.08); g.beginPath(); const x=rnd(0,256),y=rnd(0,340); g.moveTo(x,y); g.lineTo(x+rnd(-16,16),y+rnd(-16,16)); g.stroke(); } // craquelure
      g.globalAlpha=1; const vg=g.createRadialGradient(128,150,55,128,175,205); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.6)'); g.fillStyle=vg; g.fillRect(0,0,256,340);
      return tex(c);
    };

    const M=(map,rgh,extra)=> Object.assign(new THREE.MeshStandardMaterial({ map, roughness:rgh }), extra||{});
    const floorTex=tex(fc), wallTex=tex(wallC), ceilTex=tex(plC), carpTex=tex(carpC);
    wallTex.repeat.set(3,2.4); ceilTex.repeat.set(5,7); carpTex.repeat.set(1,6);
    const plankTex=tex(woodC('#2e2012','#150c05')); plankTex.repeat.set(4,4);
    return {
      floor: M(floorTex,0.34,{ metalness:0.18 }),
      wood: M(tex(woodC('#3a2814','#180d05')),0.58),
      woodDark: M(tex(woodC('#241608','#100904')),0.62),
      wall: M(wallTex,0.92),
      wainscot: M(tex(woodC('#2a1c0e','#130b05')),0.6),
      carpet: M(carpTex,0.95),
      ceil: M(ceilTex,1.0),
      brass: new THREE.MeshStandardMaterial({ color:'#8a6a2e', metalness:0.72, roughness:0.42, emissive:'#2a1d08', emissiveIntensity:0.35 }),
      brassDim: new THREE.MeshStandardMaterial({ color:'#5c4a24', metalness:0.6, roughness:0.55 }),
      plank: M(plankTex,0.7),
      floorTex, portrait
    };
  }

  initScene() {
    const THREE = window.THREE;
    const canvas = document.getElementById('hall-scene');
    if (!canvas || !canvas.clientWidth) { setTimeout(()=>this.waitThree(), 80); return; }
    const W = canvas.clientWidth, H = canvas.clientHeight;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
    renderer.setSize(W, H, false);
    this.renderer = renderer;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0a0703');
    scene.fog = new THREE.FogExp2('#0b0805', 0.028);
    this.scene = scene;

    const cam = new THREE.PerspectiveCamera(70, W/H, 0.1, 300);
    cam.rotation.order = 'YXZ';
    cam.position.set(0, 1.7, 16);
    this.cam = cam;

    scene.fog = new THREE.Fog('#08070c', 15, 76);
    scene.add(new THREE.AmbientLight('#463019', 0.5));
    const warm = new THREE.HemisphereLight('#41301a', '#0a0806', 0.58); scene.add(warm);
    const fill = new THREE.DirectionalLight('#5a4222', 0.22); fill.position.set(0,8,20); scene.add(fill);

    const mat = (c,r)=> new THREE.MeshStandardMaterial({ color:c, roughness: r==null?1:r });
    const basic = (c)=> new THREE.MeshBasicMaterial({ color:c });
    const addBox = (w,h,d,x,y,z,m)=>{ const me=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m); me.position.set(x,y,z); scene.add(me); return me; };
    const TX = this.makeTextures(THREE, renderer);

    // ---- veined marble floor (single textured plane) ----
    const HALLW = 16, HALLBACK = -34, HALLFRONT = 18;
    TX.floorTex.repeat.set(HALLW/4, (HALLFRONT-HALLBACK)/4);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(HALLW, HALLFRONT-HALLBACK), TX.floor);
    floor.rotation.x = -Math.PI/2; floor.position.set(0,0,(HALLFRONT+HALLBACK)/2); scene.add(floor);
    // coffered plaster ceiling with wood beams
    addBox(HALLW, 0.4, HALLFRONT-HALLBACK, 0, 9, (HALLFRONT+HALLBACK)/2, TX.ceil);
    for (let z=HALLFRONT-2; z>HALLBACK; z-=5){ addBox(HALLW,0.4,0.5, 0,8.75,z, TX.woodDark); }
    addBox(0.5,0.4,HALLFRONT-HALLBACK, 0,8.75,(HALLFRONT+HALLBACK)/2, TX.woodDark);
    // side walls, segmented to leave doorways into the rooms

  onResize(){ if(!this.renderer||!this.cam) return; const c=document.getElementById('hall-scene'); if(!c) return; const W=c.clientWidth,H=c.clientHeight; this.renderer.setSize(W,H,false); this.cam.aspect=W/H; this.cam.updateProjectionMatrix(); }

  loop() {
    this._raf = requestAnimationFrame(()=>this.loop());
    if (!this.renderer) return;
    const dt = Math.min(0.05, this.clock.getDelta());
    const t = this.clock.elapsedTime;
    const cam = this.cam;

    if (this.waking) {
      // rise from the floor: ease camera height up and level out the tilt/roll
      if (this.rising) {
        this.standY   += (1.7 - this.standY)   * Math.min(1, dt*0.85);
        this.wakeRoll += (0   - this.wakeRoll) * Math.min(1, dt*1.05);
        this.wakePitch+= (0   - this.wakePitch)* Math.min(1, dt*1.05);
        this.yaw      += (0   - this.yaw)      * Math.min(1, dt*0.75);
      }
      const drift = Math.sin(t*0.8)*0.024 + (this.rising ? 0 : Math.sin(t*2.1)*0.02);
      cam.position.y = this.standY;
      cam.rotation.set((this.wakePitch||0) + drift, this.yaw||0, (this.wakeRoll||0), 'YXZ');
    } else if (this.mode==='hall' && this.walkEnabled) {
      const k=this.keys;
      const f = (k['w']?1:0) - (k['s']?1:0);
      const s = (k['d']?1:0) - (k['a']?1:0);
      const running = !!(k['shift']);
      const maxSp = running ? 10.5 : 6.2;
      // arrow keys turn & look (fallback for players not using the mouse)
      const turn = (k['arrowleft']?1:0) - (k['arrowright']?1:0);
      const look = (k['arrowup']?1:0) - (k['arrowdown']?1:0);
      if (turn) this.yaw += turn*2.3*dt;
      if (look) this.pitch = Math.max(-1.2, Math.min(1.2, this.pitch + look*1.9*dt));
      const fx=-Math.sin(this.yaw), fz=-Math.cos(this.yaw);
      const rx=Math.cos(this.yaw), rz=-Math.sin(this.yaw);
      // desired velocity (normalised so diagonals aren't faster), then accelerate toward it
      let dvx = fx*f + rx*s, dvz = fz*f + rz*s;
      const dl = Math.hypot(dvx,dvz);
      if (dl>0){ dvx = dvx/dl*maxSp; dvz = dvz/dl*maxSp; }
      this.vx = (this.vx||0); this.vz = (this.vz||0);
      const rate = Math.min(1, (dl>0 ? 11 : 14)*dt);
      this.vx += (dvx - this.vx)*rate;
      this.vz += (dvz - this.vz)*rate;
      const nx = cam.position.x + this.vx*dt;
      const nz = cam.position.z + this.vz*dt;
      if (this.inWalk && this.inWalk(nx, cam.position.z)) cam.position.x = nx; else this.vx=0;
      if (this.inWalk && this.inWalk(cam.position.x, nz)) cam.position.z = nz; else this.vz=0;
      // head-bob + walk-sway, scaled by current speed
      const speed = Math.hypot(this.vx, this.vz);
      this._bob = (this._bob||0) + speed*dt*1.9;
      const amt = Math.min(1, speed/4.5);
      const bob = Math.sin(this._bob*2)*0.055*amt;
      const sway = Math.sin(this._bob)*0.02*amt;
      cam.position.y = this.standY + bob;
      cam.rotation.set(this.pitch, this.yaw, sway, 'YXZ');
      if ((f||s) && this.state.hintOn) this.setState({ hintOn:false });
      this.scanPOIs(cam.position.x, cam.position.z);
      this.checkBeats(cam.position.z, cam.position.x);
    } else if (this.mode==='arrival' && this.arriving) {
      const es=(x)=>x*x*(3-2*x);
      const a = this.arrDoor = Math.min(1, (this.arrDoor||0) + dt/3.6);
      this.yaw   += (0 - this.yaw)*Math.min(1,dt*3);
      this.pitch += (0 - this.pitch)*Math.min(1,dt*3);
      cam.position.x += (0 - cam.position.x)*Math.min(1,dt*2.6);
      // phase 1: step up to the doorstep; phase 2: walk on through into the light
      const targetZ = a < 0.55 ? this.arrivalZ+1.4 : this.arrivalZ-6.5;
      cam.position.z += (targetZ - cam.position.z)*Math.min(1,dt*(a<0.55?1.7:1.15));
      cam.rotation.set(this.pitch, this.yaw, 0, 'YXZ');
      // doors swing open, meeting-edges parting inward
      const swing = es(Math.min(1, a/0.72)) * 1.42;
      if (this.doorL) this.doorL.rotation.y = -swing;
      if (this.doorR) this.doorR.rotation.y =  swing;
      if (this.doorGlow) this.doorGlow.material.opacity = 0.08 + a*0.7;
      if (this.parlorSeam) this.parlorSeam.material.opacity = Math.max(0, 0.8 - a);
      if (this.parlorLight) this.parlorLight.intensity = 0.6 + a*3.4;
      // authored beats over the walk-through
      if (a>0.06 && (this._arrBeat||0)<1){ this._arrBeat=1; this.setState({ beatOn:true, beatMain:'The doors gave before I touched them.', beatSub:'Firelight \u2014 and the small dry sound of a deck being squared.' }); }
      if (a>0.5 && (this._arrBeat||0)<2){ this._arrBeat=2; this.setState({ beatMain:'A chair scraped back, somewhere past the wood.', beatSub:'A voice I hadn\u2019t heard yet said my name like it had known it for years.' }); }
      // gold floods as you cross the threshold, then hand off to the parlor
      if (a>0.72){ const gv=Math.min(1,(a-0.72)/0.26); if(Math.abs((this.state.gold||0)-gv)>0.03) this.setState({ gold:gv }); }
      if (a>=1 && !this._navigated){ this._navigated=true; this.setState({ beatOn:false, gold:1 }); if(!this._suppressNav) setTimeout(()=>{ window.location.href='The Parlor - Playable Prototype.dc.html'; }, 750); }
    }

    // ambience
    if (this.chLight) this.chLight.intensity = 1.6*(0.9+0.1*Math.sin(t*5));
    if (this.sconces) this.sconces.forEach((l,i)=>{ l.intensity = l._base*(0.8+0.2*Math.sin(t*8+i*1.3)) - (Math.random()<0.02?0.35:0); });
    if (this.fires) this.fires.forEach((l,i)=>{ l.intensity = 1.5*(0.78+0.22*Math.sin(t*11+i*2.1)) - (Math.random()<0.06?0.4:0); });
    if (this.parlorSeam && this.mode!=='arrival') this.parlorSeam.material.opacity = 0.35 + 0.25*Math.sin(t*3.5);
    if (this.dust){ this.dust.rotation.y = t*0.02; }
    // lightning through the window
    if (this._ltNext == null) this._ltNext = 4;
    if (t > this._ltNext) { this._lt = 1; this._ltNext = t + 7 + Math.random()*11; }
    if (this._lt > 0) {
      this._lt = Math.max(0, this._lt - dt*4.2);
      const f = this._lt * (0.55 + 0.45*Math.random());
      if (this.bolt) this.bolt.intensity = f*8;
      if (this.moon) this.moon.intensity = 0.55 + f*1.6;
      if (this.winMat) this.winMat.color.setRGB(0.15+f*0.8, 0.22+f*0.72, 0.31+f*0.6);
    } else if (this.bolt && this.bolt.intensity!==0) { this.bolt.intensity=0; if(this.moon) this.moon.intensity=0.55; if(this.winMat) this.winMat.color.setRGB(0.15,0.22,0.31); }
    if (this.chand && !this._chandSway) this.chand.rotation.z = Math.sin(t*0.5)*0.014;

    this.renderer.render(this.scene, cam);
  }

  checkBeats(z, x) {
    let idx=-1;
    for (let i=0;i<this.beats.length;i++){ if (z <= this.beats[i].z) idx=i; }
    if (idx > this._beat) { this._beat = idx; const b=this.beats[idx]; this.setState({ beatMain:b.main, beatSub:b.sub, beatOn:true, hintOn:false }); }
    if (z <= this.arrivalZ && Math.abs(x) < 3 && this.mode==='hall') {
      this.mode='arrival'; this.walkEnabled=false; this.arrDoor=0; this.arriving=true;
      this._arrBeat=0; this._navigated=false;
      this.setState({ beatOn:false, promptOn:false, hintOn:false, gold:0, isArrival:false });
    }
  }

      { x:6.6, z:-2, r:4.0, type:'murmur',

      { x:-7.68, z:10, r:3.2, type:'examine', verb:'Read the nameplate',
        em:'I read the small plate beneath the frame.', es:'EDWIN MARR. The paint has him mid-turn, same as all the rest, but his eyes haven’t quite caught up to his shoulders — he’s still watching the table over his own back. A tell, I’d learn later, cheats give right before they play the impossible card: they look anywhere but at their hands. Edwin must have noticed too. Too late for it to save him.' },
      { x:-7.68, z:3, r:3.2, type:'examine', verb:'Read the nameplate',
        em:'I read the small plate beneath the frame.', es:'CASPIAN DUFRESNE, self-declared the finest card hand in three counties, according to the plate — though the plate is the only place that claim survives. He came, I’d guess, the way men like that always come to a game they can’t lose: certain, cheerful, already composing the story he’d tell after. There’s no second portrait of him. There didn’t need to be.' },
      { x:-7.68, z:-4, r:3.2, type:'examine', verb:'Read the nameplate',
        em:'I read the small plate beneath the frame.', es:'HALVARD PIKE. An actuary, or so I’d guess from the ledger’s second column, where someone had noted his trade in a hand too neat to be his own. He’d have come with odds worked out to the decimal, certain a fair game has no cheat that arithmetic can’t survive. What he hadn’t worked out, I’d learn: the game was never fair, and losing was never really the point. Winning was going to cost him something the numbers didn’t have a column for.' },
      { x:-7.68, z:-13, r:3.2, type:'examine', verb:'Read the nameplate',
        em:'I read the small plate beneath the frame.', es:'SOLVEIG HALE. A debt of her own on the ledger’s third column, in the same neat foreign hand — a sister’s name beside it, and a hospital I didn’t recognize. I understood her before I read a word further. I did not need a clue from her portrait. I only needed to know I wasn’t the first person this house had made a bargain with, and wouldn’t be the last.' },
      { x:-7.68, z:-21, r:3.2, type:'examine', verb:'Read the nameplate',
        em:'I read the small plate beneath the frame.', es:'THEO GALL. No trade beside his name, no debt, nothing the ledger thought worth recording — which told me plenty on its own. A man who comes to a game like this owing nothing usually comes to take something instead. I don’t know what Theo tried. I know only that his portrait, like all the rest, hangs facing away from the table, and that his shoulders, even in paint, look like a man still walking backward out of a room.' },
      { x:7.68, z:12, r:3.2, type:'examine', verb:'Read the nameplate',
        em:'I read the small plate beneath the frame.', es:'BARNABY QUILL. Arrived, by the look of him, three drinks into a party he hadn’t been invited to and was delighted to have found anyway — the only face on this wall with anything like a smile still on it. I almost envied him that, until I noticed what the smile was aimed at: not the viewer. The stairs. Whatever he found up there, going up laughing, I don’t think he came down the same way. There are more doors in this house than the one I walked through.' },
      { x:7.68, z:5, r:3.2, type:'examine', verb:'Read the nameplate',
        em:'I read the small plate beneath the frame.', es:'IMOGEN THALE. No trade, no debt column, no note at all beside her name — whoever kept this ledger either didn’t know her reasons or thought better of writing them down. I found I didn’t want to guess. Some of the losing, I think, isn’t mine to read.' },
      { x:7.68, z:-11, r:3.2, type:'examine', verb:'Read the nameplate',
        em:'I read the small plate beneath the frame.', es:'CONSTANCE AUBREY-LOCKE. Old money, by the double-barreled name and the fur still painted at her throat — the kind of guest, I’d guess, who came the way other people go hunting: for the thrill of a thing that could, in theory, kill you, with none of the actual risk expected to land. In the portrait her chin is lifted a fraction too high. Aldric lifts his the same fraction, I’d notice later, in the half-second before he plays a card he has no right to be holding.' },
      { x:7.68, z:-19, r:3.2, type:'examine', verb:'Read the nameplate',
        em:'I read the small plate beneath the frame.', es:'The plate’s been rubbed half through by hands other than mine — only PERCIVAL survives it. Whoever he was, someone came back to this one more than the rest. I couldn’t blame them. There’s something almost comic in his portrait, chin low, shoulders slack, a man who’d clearly lost everything worth losing before he ever sat down at this table — for whom the stakes must have felt, absurdly, like a relief. I hoped, looking at him, that losing wasn’t the same as the ledger made it look. I was less and less sure, the longer I looked.' },
      { x:-4.4, z:-23.8, r:4.4, type:'both', verb:'Lift the velvet rope',
        m:'A velvet rope drawn across the foot of the stairs.', s:'In a house that said yes to everything, here was its single, deliberate no.',
        em:'I lifted the rope and set a foot on the first step.', es:'Above the landing the dark did not move, did not breathe. Not tonight, the house seemed to say. I let the rope fall back.' },
      { x:-15, z:0.5, r:5.2, type:'murmur',
        m:'A fire lit, in a house no one seemed to live in.', s:'Wherever I walked, the warmth had already gone on ahead of me.' },
      { x:-16, z:-14.5, r:5.4, type:'murmur',
        m:'A long table, laid for a dozen guests.', s:'Every place set, every chair pushed in \u2014 as if the party had ended the instant I opened the door.' },
      { x:13.8, z:12, r:4.4, type:'examine', verb:'Press a key',
        em:'I touched one key of the piano.', es:'The note hung in the air a beat too long \u2014 as though the room were holding it open, waiting for me to finish the phrase.' },
      { x:19.5, z:-13, r:5.4, type:'both', verb:'Read the open ledger',
        m:'A ledger lay open on the desk, a pen beside it, the ink still wet.', s:'I did not remember anyone leaving the room.',
        em:'I turned the ledger toward the light.', es:'Names, down the page, in a hand too neat to be any one guest’s own. Marr. Dufresne. Pike. Hale. Gall. Quill. Thale. Aubrey-Locke. A ninth, the ink gone soft where someone kept touching it, worn past reading. Every one crossed neatly through. At the foot, a blank line left open. My width, exactly.' },
      { x:20.6, z:-9, r:3.6, type:'examine', verb:'Spin the globe',
        em:'I spun the globe on its axis.', es:'It coasted to a stop on open water \u2014 a blank blue nowhere, where a city ought to have been.' }
    ];
    this.pois.forEach(p=>{ p.said=false; });
  }

  speak(m, s, hold) {
    this.setState({ beatMain:m, beatSub:s||'', beatOn:true, hintOn:false });
    if (this._sayTimer) clearTimeout(this._sayTimer);
    this._sayTimer = setTimeout(()=>{ this.setState({ beatOn:false }); }, hold||6200);
  }

  scanPOIs(x, z) {
    // door prompt takes priority near the parlor
    const nearDoor = z <= this.arrivalZ + 4.5 && Math.abs(x) < 4;
    if (nearDoor) { this._active=null; if(this._promptKey!=='door'){ this._promptKey='door'; this.setState({ promptOn:true, promptText:'The parlor doors \u2014 step up to them' }); } return; }
    // facing direction
    const fx=-Math.sin(this.yaw), fz=-Math.cos(this.yaw);
    let best=null, bestScore=0;
    for (const p of this.pois) {
      const dx=p.x-x, dz=p.z-z; const dist=Math.hypot(dx,dz);
      if (dist>p.r) continue;
      // auto-murmur on approach (once)
      if ((p.type==='murmur'||p.type==='both') && !p.said && dist < p.r*0.82) { p.said=true; this.speak(p.m, p.s); }
      // examinable: must be roughly looked at
      if (p.type==='examine'||p.type==='both') {
        const inv=1/(dist||0.001); const facing=(dx*fx+dz*fz)*inv;
        if (facing>0.5) { const score=facing + (1-dist/p.r)*0.6; if(score>bestScore){ bestScore=score; best=p; } }
      }
    }
    this._active = best;
    const key = best ? ('ex:'+best.verb) : 'none';
    if (key!==this._promptKey) {
      this._promptKey = key;
      if (best) this.setState({ promptOn:true, promptText:'E \u00b7 '+best.verb });
      else this.setState({ promptOn:false });
    }
  }

  tryExamine() {
    const p=this._active; if(!p||this.mode!=='hall'||!this.walkEnabled) return;
    const text = p.esFn ? p.esFn() : p.es;
    if (p.em) { this.speak(p.em, text, 6800); this.trackDoubtProgress(p); }
  }

  trackDoubtProgress(p) {
    if (!window.GMDoubt) return;
    p._read = true;
    const isTracked = (poi)=> poi.type==='examine' && poi.verb==='Read the nameplate';
    const ledgerRead = this.pois.some(poi => poi.verb==='Read the open ledger' && poi._read);
    const portraitsRead = this.pois.filter(poi => isTracked(poi) && poi._read).length;
    if (ledgerRead && portraitsRead >= 5) GMDoubt.set(1);
  }

  // ===== DEV BRIDGE =====
  devPhaseList() { return ['wake','start','hall','portraits','stairs','door','arrive']; }
  toggleDev() { const open=!this.state.devOpen; this.setState({ devOpen:open }); if(open){ this._devTick=setInterval(()=>this.forceUpdate(),250); } else if(this._devTick){ clearInterval(this._devTick); this._devTick=null; } }
  devSnapshot() { const c=this.cam, st=this.state; const phase=st.isArrival?'card':(this.mode==='arrival'?'door':'explore'); return { phase, mode:this.mode||'?', walk:!!this.walkEnabled, camZ:c?+c.position.z.toFixed(1):null, camX:c?+c.position.x.toFixed(1):null, yaw:+(this.yaw||0).toFixed(2), beat:this._beat, pois:(this.pois||[]).length, sceneReady:!!this.scene, errors:(this._errs||[]).length }; }
  devGoTo(name) {
    (this._wt||[]).forEach(clearTimeout); this._wt=[];
    this.waking=false; this.rising=false; this.standY=1.7; this.wakeRoll=0; this.wakePitch=0;
    if (this._pulseTick) { clearInterval(this._pulseTick); this._pulseTick=null; }
    const tp=(z)=>{ if(this.cam) this.cam.position.set(0,1.7,z); };
    if(name==='wake'){ this.beginWake(); return; }
    if(name==='start'||name==='hall'||name==='portraits'||name==='stairs'||name==='door'){
      this.mode='hall'; this.walkEnabled=true; this._beat=-1; this.arriving=false; this.arrDoor=0; this.yaw=0; this.pitch=0;
      this._arrBeat=0; this._navigated=false;
      if(this.doorL) this.doorL.rotation.y=0; if(this.doorR) this.doorR.rotation.y=0;
      if(this.doorGlow) this.doorGlow.material.opacity=0.08;
      this.setState({ fade:0, isArrival:false, beatOn:false, promptOn:false, gold:0, hintOn:(name==='start') });
      tp(name==='hall'?2:name==='portraits'?-9:name==='stairs'?-19:name==='door'?this.arrivalZ:16);
    } else if(name==='card'||name==='arrive'){ this.mode='arrival'; this.walkEnabled=false; this.arriving=true; this.arrDoor=0; this._arrBeat=0; this._navigated=false; if(this.doorL) this.doorL.rotation.y=0; if(this.doorR) this.doorR.rotation.y=0; if(this.cam) this.cam.position.set(0,1.7,this.arrivalZ+3.5); this.setState({ fade:0, isArrival:true, beatOn:false, promptOn:false, gold:0 }); }
  }

  renderVals() {
    const st = this.state;
    const _snap = this.devSnapshot(); const _cur = _snap.phase;
    const _phStyle = (n)=> 'font-family:\'JetBrains Mono\',monospace;font-size:9px;letter-spacing:0.05em;padding:4px 7px;border:1px solid '+(n===_cur?'#F2C759':'rgba(242,199,89,0.25)')+';color:'+(n===_cur?'#FFFFF2':'#A69980')+';background:'+(n===_cur?'rgba(242,199,89,0.14)':'transparent')+';cursor:pointer;';
    const devPhases = this.devPhaseList().map(n=>({ label:n, on:()=>this.devGoTo(n), style:_phStyle(n) }));
    const devRows = Object.keys(_snap).map(k=>({ k, v:String(_snap[k]) }));
    return {
      isArrival: st.isArrival,
      devOpen: st.devOpen, devPhases, devRows, onDevToggle:()=>this.toggleDev(), onDevClose:()=>this.toggleDev(),
      beatMain: st.beatMain, beatSub: st.beatSub,
      beatStyle: 'opacity:'+((st.beatOn && !st.isArrival)?1:0)+';',
      hintStyle: 'opacity:'+(st.hintOn?0.9:0)+';',
      promptStyle: 'opacity:'+((st.promptOn && !st.beatOn)?1:0)+';',
      promptText: st.promptText,
      fadeStyle: 'position:fixed;inset:0;z-index:45;background:#000;transition:opacity 0.9s ease;opacity:'+st.fade+';pointer-events:'+(st.fade>0.02?'auto':'none')+';',
      goldStyle: 'position:fixed;inset:0;z-index:44;pointer-events:none;background:radial-gradient(60% 55% at 50% 52%, rgba(255,226,150,0.96), rgba(240,176,82,0.5) 45%, rgba(120,70,20,0) 78%);opacity:'+(st.gold||0)+';transition:opacity .5s ease;',
      vignetteStyle: 'position:fixed;inset:0;z-index:43;pointer-events:none;box-shadow:inset 0 0 '+((st.headachePulse||0)*230)+'px '+((st.headachePulse||0)*70)+'px rgba(0,0,0,'+((st.headachePulse||0)*0.7)+');',
      parlorHref: 'The Parlor - Playable Prototype.dc.html'
    };
  }
}
</script>
