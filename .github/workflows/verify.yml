name: Verify portable game contracts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:portable

  unity-opening-required:
    if: ${{ false }}
    runs-on: [self-hosted, macOS, unity]
    steps:
      - run: npm run verify:opening
